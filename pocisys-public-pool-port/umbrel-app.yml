manifestVersion: 1
id: pocisys-public-pool-port
category: bitcoin
name: PoCiSys Public Pool Port
version: "0.1.6"
tagline: Solo mine through your node with verified block states
icon: https://raw.githubusercontent.com/12gaugekenshin/Pocisys-public-pool-port/main/pocisys-public-pool-port/icon-v2.png
description: >-
  A solo-mining pool powered by your synchronized Umbrel Bitcoin Node. Connect
  ASICs on port 3334 and monitor fresh worker hashrate, shares, candidates,
  Bitcoin Core acceptance, active-chain status, confirmations, reorgs, and
  100-block coinbase maturity. It runs beside the stock Public Pool on port
  3333, persists pool data across updates, and keeps Bitcoin RPC private.
developer: PoCiSys
website: https://github.com/12gaugekenshin/PoCiSys-Public-Pool-Port
repo: https://github.com/12gaugekenshin/PoCiSys-Public-Pool-Port
support: https://github.com/12gaugekenshin/PoCiSys-Public-Pool-Port/issues
submitter: 12gaugekenshin
submission: https://github.com/12gaugekenshin/PoCiSys-Public-Pool-Port
dependencies:
  - bitcoin
port: 8585
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Adds read-only Public Pool compatibility endpoints on LAN port 2020. The new
  /api/pool and /api/info routes expose current hashrate, worker count, block
  height, and PoCiSys user-agent totals without opening another port.
widgets:
  - id: pool-stats
    type: four-stats
    refresh: 10s
    endpoint: dashboard:8080/api/widget
    link: ""
    example:
      type: four-stats
      items:
        - title: Hash Rate
          text: 2.40 TH/s
        - title: Workers
          text: "3"
        - title: Blocks
          text: "0"
        - title: Height
          text: "900000"
