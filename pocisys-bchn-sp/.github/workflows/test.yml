name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: true
      - run: gofmt -w cmd pkg && git diff --exit-code
      - run: go test ./...
      - run: python -m unittest discover -s tests -v
