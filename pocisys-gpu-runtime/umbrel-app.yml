manifestVersion: 1
id: pocisys-gpu-runtime
category: ai
name: PoCiSys GPU Runtime
version: "0.1.5"
tagline: Run private local AI on your Tesla P100
icon: icon-v2.png
description: >-
  A hardware-specific Tesla P100 inference service for umbrelOS. It prepares
  the NVIDIA driver, validates the card, starts a private Ollama endpoint, and
  reports GPU health from one dashboard. Models and logs stay on the existing
  hermes-agent-ssd volume. Requires an x86-64 server, Tesla P100 PCIe 16 GB,
  matching kernel headers, forced-air cooling, and Secure Boot disabled.
developer: PoCiSys
website: https://pocisys.io/
submitter: 12gaugekenshin
submission: https://github.com/12gaugekenshin/PoCiSys-GPU-Runtime
repo: https://github.com/12gaugekenshin/PoCiSys-GPU-Runtime
support: https://github.com/12gaugekenshin/PoCiSys-GPU-Runtime/issues
port: 8780
gallery: []
releaseNotes: >-
  Keeps the active local model resident indefinitely to eliminate idle reload
  delays and updates the bounded dashboard Safe Test to use the installed
  qwen3.5:9b-64k model alias.
dependencies: []
