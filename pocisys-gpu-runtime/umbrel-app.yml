port: 8780
gallery: []
releaseNotes: >-
  Adds direct Commander DUO discovery diagnostics to the cooling dashboard and
  mirrors fan-controller output into Umbrel troubleshooting logs. Safety gates
  remain closed until Fan Port 1 reports nonzero RPM at 100%.
