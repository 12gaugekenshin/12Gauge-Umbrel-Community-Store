gallery: []
releaseNotes: >-
  Fixes Commander DUO startup by installing OpenLinkHub's required PipeWire
  runtime library. OpenLinkHub startup output is now mirrored into Umbrel's
  troubleshooting log while remaining available on persistent storage.
