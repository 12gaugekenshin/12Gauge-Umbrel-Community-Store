manifestVersion: 1
id: pocisys-hash-monitor
category: bitcoin
name: PoCiSys Hash Monitor
version: "1.6.2"
tagline: Live SHA-256 fleet monitoring with optional LuxOS control
icon: https://raw.githubusercontent.com/12gaugekenshin/PoCi-Hash-Monitor/main/pocisys-hash-monitor/icon-v2.png
description: >-
  PoCiSys Hash Monitor is a lightweight dashboard built by 12GaugeKenshin for
  monitoring multiple AxeOS, NerdAxe/NerdQaxe, and LuxOS miners from one
  place. Monitoring remains read-only by default; optional LuxOS Control Mode
  can be explicitly armed for selected LuxOS miners.


  View live hashrate, temperatures, cooling, share quality, compact best
  difficulty, chip and hashboard health, self-hosted Public Pool workers, and automatic
  BTC/BCH/BSV/XEC/DGB/CHTA network data. Configure dashboard-wide Discord alerts for miner
  outages, recoveries, low hashrate, temperature, pool switches, bad shares,
  best difficulty, and block events.


  Optional LuxOS control uses only existing native profiles and individual
  hashboard restart/off commands. Other miner types remain read-only. PoCiSys
  stores only its small config.json file and keeps current telemetry and the
  latest 25 control actions in bounded memory, with no database or long-term
  hashrate history. Authenticated Hermes MCP access exposes read-only telemetry.
developer: PoCiSys
