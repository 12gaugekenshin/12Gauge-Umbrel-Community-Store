manifestVersion: 1
id: pocisys-hash-monitor
category: bitcoin
name: PoCiSys Hash Monitor
version: "1.5.1"
tagline: Read-only monitoring for your SHA-256 miner fleet
icon: https://raw.githubusercontent.com/12gaugekenshin/PoCi-Hash-Monitor/main/pocisys-hash-monitor/icon.svg
description: >-
  PoCiSys Hash Monitor is a lightweight, read-only dashboard built by
  12GaugeKenshin for monitoring multiple AxeOS, NerdAxe/NerdQaxe, and LuxOS
  miners from one place.


  View live hashrate, temperatures, cooling, share quality, compact best
  difficulty, chip and hashboard health, self-hosted Public Pool workers, and automatic
  BTC/BCH/BSV/XEC/DGB/CHTA network data. Configure dashboard-wide Discord alerts for miner
  outages, recoveries, low hashrate, temperature, pool switches, bad shares,
  best difficulty, and block events.


  PoCiSys never changes miner settings. It stores only its small config.json
  file and keeps current telemetry in bounded memory with no database or
  long-term hashrate history. Its optional authenticated Hermes MCP endpoint
  exposes only read-only host, miner, pool, and block-odds telemetry.
developer: PoCiSys
