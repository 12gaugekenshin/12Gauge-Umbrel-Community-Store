manifestVersion: 1
id: pocisys-hash-monitor
category: bitcoin
name: PoCiSys Hash Monitor
version: "1.5.1"
tagline: One clean dashboard for your SHA-256 miners
icon: icon-v2.png
description: >-
  A lightweight, read-only dashboard for AxeOS, NerdAxe-style, and LuxOS
  miners. See hashrate, temperatures, cooling, shares, pool workers, network
  data, and block odds in one place. Optional Discord alerts report important
  changes, while authenticated Hermes MCP access exposes read-only telemetry.
  The app never changes miner settings and keeps no growing history database.
developer: PoCiSys
website: https://pocisys.io/
submitter: 12gaugekenshin
submission: https://github.com/12gaugekenshin/PoCi-Hash-Monitor
repo: https://github.com/12gaugekenshin/PoCi-Hash-Monitor
support: https://github.com/12gaugekenshin/PoCi-Hash-Monitor/issues
port: 8765
gallery:
  - https://raw.githubusercontent.com/12gaugekenshin/PoCi-Hash-Monitor/HEAD/pocisys-hash-monitor/1.png
  - https://raw.githubusercontent.com/12gaugekenshin/PoCi-Hash-Monitor/HEAD/pocisys-hash-monitor/2.png
releaseNotes: >-
  Fixes intermittent 502 errors on Umbrel systems that also run Public Pool by
  routing the app proxy through PoCiSys's unique Docker network alias. Includes
  authenticated, read-only Hermes MCP access for miner, pool, odds, and
  container-visible system telemetry.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
